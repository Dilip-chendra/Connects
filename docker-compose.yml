services:
  postgres:
    image: postgres:16-alpine
    container_name: connects-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-connects_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connects_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-connects_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connects_app} -d ${POSTGRES_DB:-connects_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - connects_net

  redis:
    image: redis:7-alpine
    container_name: connects-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - connects_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  connects_net:
    driver: bridge
